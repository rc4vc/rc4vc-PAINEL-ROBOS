<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Central de RPAs">
  <!-- Escudo (seguro / proteção) com um robô dentro: a central dos robôs da corretora.
       Cores da marca RC4VC: teal (#0e9aa7 → #0a7c87) e laranja (#f47b20). -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22b5c2"/>
      <stop offset="1" stop-color="#0a7c87"/>
    </linearGradient>
  </defs>
  <path d="M32 3.5 8 12.5v17.2c0 15.2 10.2 26.6 24 30.8 13.8-4.2 24-15.6 24-30.8V12.5L32 3.5Z" fill="url(#g)"/>
  <path d="M32 3.5 8 12.5v17.2c0 15.2 10.2 26.6 24 30.8V3.5Z" fill="#fff" opacity=".07"/>
  <!-- antena -->
  <rect x="30.6" y="14.5" width="2.8" height="7" rx="1.4" fill="#fff"/>
  <circle cx="32" cy="13.2" r="3.4" fill="#f47b20"/>
  <!-- cabeça -->
  <rect x="18.5" y="21.5" width="27" height="21" rx="7" fill="#fff"/>
  <!-- olhos -->
  <circle cx="26.2" cy="31" r="3.3" fill="#0a7c87"/>
  <circle cx="37.8" cy="31" r="3.3" fill="#0a7c87"/>
  <!-- boca (sorriso discreto) -->
  <path d="M27 37.2c2.9 2 7.1 2 10 0" stroke="#0a7c87" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <!-- orelhas -->
  <rect x="15.5" y="28" width="3" height="8" rx="1.5" fill="#fff"/>
  <rect x="45.5" y="28" width="3" height="8" rx="1.5" fill="#fff"/>
</svg>
